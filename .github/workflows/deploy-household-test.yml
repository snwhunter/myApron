name: Deploy myApron household test

on:
  push:
    branches: [test/household-preview]
    paths-ignore:
      - deployment/household-test-url.txt
  workflow_dispatch:

concurrency:
  group: myapron-household-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_DATABASE_NAME: myapron-household-test-db
      TEST_BUCKET_NAME: myapron-household-test-images

    steps:
      - name: Check out household test
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or reuse test D1 database
        id: d1
        shell: bash
        run: |
          database_id="$({ npx wrangler d1 list --json | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const databases = JSON.parse(input);
            const database = databases.find((item) => item.name === process.env.TEST_DATABASE_NAME);
            if (database) process.stdout.write(database.uuid);
          '; })"

          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create "$TEST_DATABASE_NAME" --location wnam
            database_id="$({ npx wrangler d1 list --json | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const databases = JSON.parse(input);
              const database = databases.find((item) => item.name === process.env.TEST_DATABASE_NAME);
              if (!database) throw new Error("Test database was not found after creation");
              process.stdout.write(database.uuid);
            '; })"
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Create or reuse test R2 bucket
        shell: bash
        run: |
          if ! npx wrangler r2 bucket list | grep -Eq "(^|[^[:alnum:]-])${TEST_BUCKET_NAME}([^[:alnum:]-]|$)"; then
            npx wrangler r2 bucket create "$TEST_BUCKET_NAME" --location wnam
          fi

      - name: Configure isolated test bindings
        env:
          MYAPRON_D1_DATABASE_NAME: ${{ env.TEST_DATABASE_NAME }}
          MYAPRON_R2_BUCKET_NAME: ${{ env.TEST_BUCKET_NAME }}
        run: node scripts/configure-cloudflare-test.mjs "${{ steps.d1.outputs.database_id }}"

      - name: Build household test
        env:
          MYAPRON_CLOUDFLARE_DEPLOY: "1"
          MYAPRON_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          MYAPRON_D1_DATABASE_NAME: ${{ env.TEST_DATABASE_NAME }}
          MYAPRON_R2_BUCKET_NAME: ${{ env.TEST_BUCKET_NAME }}
        run: npm run build

      - name: Apply test D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler/household-test-migrations.json

      - name: Deploy test Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          output="$(npx vinext deploy --skip-build 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1)"
          if [[ -z "$url" ]]; then
            echo "The test Worker deployed, but no workers.dev URL was reported."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Household test" >> "$GITHUB_STEP_SUMMARY"
          echo "$url/household" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test household page
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$url/household" >/dev/null
          echo "myApron household test is live at $url/household"

      - name: Record household test URL
        shell: bash
        run: |
          mkdir -p deployment
          printf '%s/household\n' "${{ steps.deploy.outputs.url }}" > deployment/household-test-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/household-test-url.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record household test URL [skip ci]"
            git push
          fi
