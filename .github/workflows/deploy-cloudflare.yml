name: Deploy myApron to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: myapron-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or reuse D1 database
        id: d1
        shell: bash
        run: |
          database_id="$({ npx wrangler d1 list --json | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const databases = JSON.parse(input);
            const database = databases.find((item) => item.name === "myapron-db");
            if (database) process.stdout.write(database.uuid);
          '; } 2>/dev/null)"

          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create myapron-db --location wnam
            database_id="$({ npx wrangler d1 list --json | node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const databases = JSON.parse(input);
              const database = databases.find((item) => item.name === "myapron-db");
              if (!database) throw new Error("myapron-db was not found after creation");
              process.stdout.write(database.uuid);
            '; } 2>/dev/null)"
          fi

          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Create or reuse R2 bucket
        shell: bash
        run: |
          if ! npx wrangler r2 bucket list | grep -Eq '(^|[^[:alnum:]-])myapron-images([^[:alnum:]-]|$)'; then
            npx wrangler r2 bucket create myapron-images --location wnam
          fi

      - name: Configure production bindings
        run: node scripts/configure-cloudflare.mjs "${{ steps.d1.outputs.database_id }}"

      - name: Build application
        env:
          MYAPRON_CLOUDFLARE_DEPLOY: "1"
          MYAPRON_D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler/migrations.json

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          output="$(npx vinext deploy --skip-build 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1)"
          if [[ -z "$url" ]]; then
            echo "The Worker deployed, but Wrangler did not report a workers.dev URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test workers.dev
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$url/" >/dev/null
          echo "myApron is live at $url"
